<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midias em HTML</title>
</head>
<body>
    <h1>Imagem dinamica</h1>
    <p>
        Tente abrir esse site em varios dispositivos diferentes ou simplesmente aumente o tamanho do seu navgador.
    </p>
    <picture>
        <source media="(max-width:700px)" srcset="imagens/foto-p.png" type="image/png">
        <source media="(max-width:1050px )" srcset="imagens/foto-m.png" type="image/png">
        <img src="imagens/foto-g.png" alt="Imagem flexivel">
    </picture>

    <h1>Reproduzindo Audio</h1>
    <p>
        Vamos aprender a reproduzir audios em HTML
    </p>
    <audio preload="metadata" autoplay controls>
        <source src="midia/proporcionar.mp3.mp3" type="audio/mpeg">
    </audio>
</body>
</html>
