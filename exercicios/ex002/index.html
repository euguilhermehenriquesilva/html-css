<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paragrafos</title>
</head>
<body>
    <h1>Paragrafos e quebras de linha</h1>
    <hr>
    <p>
        Você pode escrever um paragrafo de qualquer jeito. <br> Basta colocar tudo no meio das tags &lt;p&gt; <!--LESS THAN --> <!--GREATER THAN -->
    </p>
    <p>
        Se precisar quebrar o texto em alum lugar especifico. <br>
        Use a tag &lt;br&gt; 
    </p>
    <p>
        Vamos adicionar alguns simbolos especiais:
        &reg;
        &copy;
        &trade;
        &euro;
        &pound;
        &yen;
        &cent;
        &Delta;
        &uparrow;
        &uarr;
    </p>
    <p>
        Vamos adicionar alguns emojis: 
        &#x1F60E;
        
    </p>
</body>
</html>
